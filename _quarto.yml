  page-navigation: true

  page-footer:
    left: |
      EO AI/ML Training · © 2025–2026 Dimitrios Kasampalis · [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)
    right:
      - icon: envelope
        href: mailto:dimitris@anefelo.com
        aria-label: Email the author
      - icon: globe
        href: https://anefelo.com
        aria-label: Anefelo website
      - icon: github
        href: https://github.com/anefelo/eo-ai-ml-training
        aria-label: GitHub repository

format:
  html:
    theme: [cosmo, styles/custom.scss]
    css:
      - styles/custom.css
      - styles/phase2-enhancements.css
    mermaid:
      theme: default
    toc: true
    toc-depth: 3
    toc-expand: 2
    toc-title: "On This Page"
    code-copy: true
    code-fold: false
    code-tools: false
    code-link: true
    code-overflow: wrap
    number-sections: false
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    citations-hover: true
    footnotes-hover: true
    lightbox:
      match: auto
      effect: zoom
      desc-position: bottom
      loop: true

comments:
  hypothesis: false

filters:
  - include-code-files

# Notebooks are published with the outputs stored in the .ipynb files; nothing is executed at build time
# (the labs need Colab, Earth Engine credentials and/or a GPU).
execute:
  enabled: false

language:
  title-block-author-single: "Instructor"
  title-block-published: "Date"
  toc-title-document: "Contents"
